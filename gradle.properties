# ── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
# Loom's remap/decompile tasks are not configuration-cache safe.
org.gradle.configuration-cache=false

# ── Mod identity ────────────────────────────────────────────────────────────
mod.id=fogcontrol
mod.name=Fog Control
mod.group=net.frsprojects.fogcontrol
mod.version=1.1.1
mod.license=All Rights Reserved
mod.description=Server-controlled, command-configurable terrain fog. Lets the fog at the render distance edge be partially transparent.
mod.authors=FRS-Projects
mod.source=https://github.com/frs-projects/fogcontrol
mod.mixins=fogcontrol.mixins.json

# ── Toolchain ───────────────────────────────────────────────────────────────
# :core targets the lowest Java in the matrix (1.20.1 runs on Java 17).
core.java=17
